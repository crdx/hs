name: release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                    - target: aarch64-unknown-linux-gnu
                      os: ubuntu-latest

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
              with:
                  target: ${{ matrix.target }}
                  command: build
                  args: --release

            - name: Prepare artifact
              shell: bash
              run: |
                  BINARY_NAME="${{ github.event.repository.name }}"
                  TARGET="${{ matrix.target }}"

                  BINARY_PATH="target/${TARGET}/release/${BINARY_NAME}"
                  ARCHIVE_NAME="${{ github.event.repository.name }}-${TARGET}"

                  tar czf "${ARCHIVE_NAME}.tar.gz" -C "target/${TARGET}/release" "$(basename ${BINARY_PATH})"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ github.event.repository.name }}-${{ matrix.target }}
                  path: |
                      *.tar.gz

    release:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  merge-multiple: true

            - name: Install just
              run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --tag 1.58.0 --to /usr/local/bin

            - name: Extract changelog
              id: changelog
              run: |
                  BODY=$(just release::notes "${GITHUB_REF_NAME}")
                  {
                      echo "body<<EOF"
                      echo "$BODY"
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Create release
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  shopt -s nullglob
                  ASSETS=(*.tar.gz)
                  gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes "$BODY" --latest
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BODY: ${{ steps.changelog.outputs.body }}
